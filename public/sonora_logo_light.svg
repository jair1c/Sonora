<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Light Luxury Paper Gradient -->
    <linearGradient id="bgLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0" />
      <stop offset="50%" stop-color="#F5F2EA" />
      <stop offset="100%" stop-color="#EAE5DA" />
    </linearGradient>

    <!-- Deep Obsidian Matte -->
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22201D" />
      <stop offset="100%" stop-color="#0F0E0D" />
    </linearGradient>
  </defs>

  <!-- 1. App Icon Rounded Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bgLightGrad)" stroke="#DED8CD" stroke-width="3" />

  <!-- 2. Symmetrical 8-Petal Harmonic Floral Geometry -->
  <g transform="translate(256, 256)">
    <!-- Outer 8-Petal Contour Wave -->
    <path d="M 0.00 -182.00 C 37.12 -182.00, 89.28 -174.12, 128.69 -128.69 C 174.12 -89.28, 182.00 -37.12, 182.00 0.00 C 182.00 37.12, 174.12 89.28, 128.69 128.69 C 89.28 174.12, 37.12 182.00 0.00 182.00 C -37.12 182.00, -89.28 174.12, -128.69 128.69 C -174.12 89.28, -182.00 37.12, -182.00 0.00 C -182.00 -37.12, -174.12 -89.28, -128.69 -128.69 C -89.28 -174.12, -37.12 -182.00 0.00 -182.00 Z"
          fill="none"
          stroke="url(#obsidianGrad)"
          stroke-width="5.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95" />

    <!-- Secondary 8-Petal Dotted Ring -->
    <path d="M 0.00 -156.00 C 31.82 -156.00, 76.53 -149.25, 110.31 -110.31 C 149.25 -76.53, 156.00 -31.82, 156.00 0.00 C 156.00 31.82, 149.25 76.53, 110.31 110.31 C 76.53 149.25, 31.82 156.00 0.00 156.00 C -31.82 156.00, -76.53 149.25, -110.31 110.31 C -149.25 76.53, -156.00 31.82, -156.00 0.00 C -156.00 -31.82, -149.25 -76.53, -110.31 -110.31 C -76.53 -149.25, -31.82 -156.00 0.00 -156.00 Z"
          fill="none"
          stroke="#9E978B"
          stroke-width="2.5"
          stroke-dasharray="8 6"
          opacity="0.6" />

    <!-- Concentric Vinyl Sound Wave Grooves -->
    <circle cx="0" cy="0" r="126" fill="none" stroke="#121212" stroke-width="1.8" opacity="0.25" />
    <circle cx="0" cy="0" r="102" fill="none" stroke="#121212" stroke-width="2" opacity="0.35" />
    <circle cx="0" cy="0" r="78" fill="none" stroke="#121212" stroke-width="2.2" opacity="0.5" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#obsidianGrad)" stroke-width="2.6" opacity="0.8" />

    <!-- Central Vinyl Disc -->
    <circle cx="0" cy="0" r="32" fill="#121212" stroke="#F5F2EA" stroke-width="3" />
    <circle cx="0" cy="0" r="9" fill="#F5F2EA" stroke="#121212" stroke-width="2" />

    <!-- Top Scrubber Dot -->
    <circle cx="0" cy="-182" r="6" fill="#121212" stroke="#F5F2EA" stroke-width="1.5" />
    <circle cx="182" cy="0" r="4.5" fill="#75726B" stroke="#F5F2EA" stroke-width="1.5" />
    <circle cx="0" cy="182" r="4.5" fill="#75726B" stroke="#F5F2EA" stroke-width="1.5" />
    <circle cx="-182" cy="0" r="4.5" fill="#75726B" stroke="#F5F2EA" stroke-width="1.5" />
  </g>
</svg>

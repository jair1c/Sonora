<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181715" />
      <stop offset="50%" stop-color="#0F0E0D" />
      <stop offset="100%" stop-color="#080707" />
    </linearGradient>

    <!-- Warm Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="35%" stop-color="#E8C782" />
      <stop offset="70%" stop-color="#C99E52" />
      <stop offset="100%" stop-color="#E5BE72" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F3DFB5" />
      <stop offset="80%" stop-color="#C99E52" />
      <stop offset="100%" stop-color="#8C6727" />
    </radialGradient>
  </defs>

  <!-- 1. App Icon Rounded Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bgGrad)" stroke="#262420" stroke-width="3" />

  <!-- 2. Subtle Inner Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="107" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.15" />

  <!-- 3. Symmetrical 8-Petal Harmonic Floral Geometry (External Resonator) -->
  <g transform="translate(256, 256)">
    <!-- Outer 8-Petal Contour Wave -->
    <path d="M 0.00 -182.00 C 37.12 -182.00, 89.28 -174.12, 128.69 -128.69 C 174.12 -89.28, 182.00 -37.12, 182.00 0.00 C 182.00 37.12, 174.12 89.28, 128.69 128.69 C 89.28 174.12, 37.12 182.00 0.00 182.00 C -37.12 182.00, -89.28 174.12, -128.69 128.69 C -174.12 89.28, -182.00 37.12, -182.00 0.00 C -182.00 -37.12, -174.12 -89.28, -128.69 -128.69 C -89.28 -174.12, -37.12 -182.00 0.00 -182.00 Z"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#goldGlow)"
          opacity="0.95" />

    <!-- 4. Secondary Concentric 8-Petal Acoustic Harmonic Line -->
    <path d="M 0.00 -156.00 C 31.82 -156.00, 76.53 -149.25, 110.31 -110.31 C 149.25 -76.53, 156.00 -31.82, 156.00 0.00 C 156.00 31.82, 149.25 76.53, 110.31 110.31 C 76.53 149.25, 31.82 156.00 0.00 156.00 C -31.82 156.00, -76.53 149.25, -110.31 110.31 C -149.25 76.53, -156.00 31.82, -156.00 0.00 C -156.00 -31.82, -149.25 -76.53, -110.31 -110.31 C -76.53 -149.25, -31.82 -156.00 0.00 -156.00 Z"
          fill="none"
          stroke="#E5C07B"
          stroke-width="2.5"
          stroke-dasharray="8 6"
          opacity="0.5" />

    <!-- 5. Concentric Vinyl Sound Wave Grooves -->
    <circle cx="0" cy="0" r="126" fill="none" stroke="#FAF8F5" stroke-width="1.8" opacity="0.3" />
    <circle cx="0" cy="0" r="102" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" opacity="0.4" />
    <circle cx="0" cy="0" r="78" fill="none" stroke="#FAF8F5" stroke-width="2" opacity="0.5" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.75" />

    <!-- 6. Central Acoustic Core / Vinyl Spindle Disc -->
    <circle cx="0" cy="0" r="32" fill="url(#centerCore)" stroke="#FFFFFF" stroke-width="3" filter="url(#goldGlow)" />

    <!-- Center Center Hole -->
    <circle cx="0" cy="0" r="9" fill="#0F0E0D" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- 7. Four Subtle Cardinal Resonance Sparks -->
    <circle cx="0" cy="-182" r="6" fill="#FFFFFF" stroke="#0F0E0D" stroke-width="1.5" />
    <circle cx="182" cy="0" r="4.5" fill="#E8C782" stroke="#0F0E0D" stroke-width="1.5" />
    <circle cx="0" cy="182" r="4.5" fill="#E8C782" stroke="#0F0E0D" stroke-width="1.5" />
    <circle cx="-182" cy="0" r="4.5" fill="#E8C782" stroke="#0F0E0D" stroke-width="1.5" />
  </g>
</svg>
